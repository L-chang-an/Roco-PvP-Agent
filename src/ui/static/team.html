<!DOCTYPE html>
<html lang="zh-CN">
<!-- ============================================================
  组队页（/team）— 服务端直出静态页（见 ui/server.py 的 GET /team）。
  职责：选将组队 + 技能池配置 + 血脉/个体值/性格 + 校验 + 保存/加载。
  结构：
    - header：品牌 + 顶部导航；page-heading：标题 + 队伍规模选择 + 校验按钮
    - #build-layout：三栏 #catalog-panel（精灵目录）/ #team-panel（槽位+编辑器+保存）
      / #skill-panel（当前精灵技能池）
  数据全部来自 /api/team/*（ui/routes_team.py），前端不自行计算规则；
  脚本顺序：app.js（DOM 助手 escapeHtml）→ team.js（组队逻辑）。
============================================================ -->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>组队 · Roco PVP Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="team-page">
  <header class="app-header">
    <a class="brand" href="/" aria-label="Roco PVP Agent 首页">
      <span class="brand-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="M8 9.5 12 12l4-2.5M12 12v5"/></svg></span>
      <span class="brand-name">ROCO<span class="brand-subtitle">PVP AGENT</span></span>
    </a>
    <nav class="top-nav" aria-label="页面导航">
      <a class="top-link" href="/"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg><span>聊天</span></a>
      <a class="top-link active" href="/team" aria-current="page"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>组队</span></a>
      <a class="top-link" href="/battle"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 3 17 17M3 3l1 5 4-4-5-1ZM3 21l6-6m-3 7-4-4M21 3l-1 5-4-4 5-1Zm0 18-6-6m3 7 4-4"/></svg><span>对战</span></a>
      <a class="top-link" href="/spectate"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>观战</span></a>
    </nav>
    <span class="workspace-label">策略实验室 <span class="status-dot" aria-hidden="true"></span></span>
  </header>

  <div class="page-heading">
    <div>
      <p class="eyebrow">TEAM BUILDER</p>
      <h1>精灵组队</h1>
      <p class="page-description">挑选精灵、搭配技能，构建你的专属对战阵容。</p>
    </div>
    <div class="team-controls">
      <label class="control-label">队伍规模
        <select id="team-size-select" title="每方可携带精灵数（3–6，管理员规则）"></select>
      </label>
      <span id="team-count" class="muted"></span>
      <button id="btn-validate" class="ghost" title="校验整队合法性（保存的闸门）">校验队伍</button>
    </div>
  </div>

  <main id="build-layout">
    <!-- 左：精灵目录（客户端过滤；BOSS 禁选；同家族冲突标黄） -->
    <aside id="catalog-panel">
      <h2><span class="panel-index">01</span>精灵目录 <small id="spirit-count"></small></h2>
      <input id="spirit-search" type="search" placeholder="搜索名称 / 编号 / 系别…">
      <div id="spirit-list" class="catalog-list"></div>
    </aside>

    <!-- 中：队伍槽位 + 槽位编辑器 + 校验结果 + 保存/加载 -->
    <section id="team-panel">
      <div class="section-heading"><h2><span class="panel-index">02</span>当前队伍</h2><span class="muted">配置你的对战阵容</span></div>
      <div id="roster-slots"></div>
      <div id="slot-editor"></div>
      <div id="validate-result" class="validate-box"></div>
      <div id="item-panel" class="editor-section">
        <div class="editor-title">对战道具（队伍级，对局中可使用）</div>
        <div id="item-list"></div>
      </div>
      <div id="save-panel">
        <input id="save-path" type="text" placeholder="保存文件名（如 我的队伍.json）或绝对路径">
        <button id="btn-save" class="primary" title="校验通过后保存">保存队伍</button>
      </div>
      <div id="load-panel">
        <select id="saved-list" title="已保存的队伍（teams/ 目录）"></select>
        <button id="btn-load" class="ghost">加载</button>
        <button id="btn-delete" class="ghost" title="删除选中的已存队伍">删除</button>
      </div>
    </section>

    <!-- 右：当前选中精灵的可学技能池（未实装置灰不可选） -->
    <aside id="skill-panel">
      <h2><span class="panel-index">03</span>技能池 <small id="skill-count"></small></h2>
      <input id="skill-search" type="search" placeholder="搜索技能名…">
      <div id="skill-list" class="catalog-list"></div>
    </aside>
  </main>

  <div id="notice" class="notice" role="status"></div>

  <script src="/static/app.js"></script>
  <script src="/static/team-components.js"></script>
  <script src="/static/team.js"></script>
</body>
</html>
