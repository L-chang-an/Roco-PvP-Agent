[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roco-pvp-agent"
version = "0.2.0"
description = "Roco PVP Agent — 人机协作从零重建的自对战 LLM agent（chat mode 起步）"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "langchain-core>=0.3.29",
  "langchain-openai>=0.2.14",
  "pydantic>=2.10.0",
  "rich>=13.9.4",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
ui = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]

[tool.hatch.build.targets.wheel]
# packages 模式：每个包目录下的全部文件（含 environment/data、ui/static）自动进 wheel，
# 无需 force-include（原 force-include 会与 packages 重复导致构建失败，2026-08-25 移除）。
packages = ["src/roco_pvp_agent", "src/environment", "src/ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "pytest-cov>=7.1.0",
]
